version: 2
updates:
  # Keep pinned GitHub Actions fresh. Renovate handles Nix inputs
  # (see .github/renovate.json).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Rome"
    labels:
      - "deps"
      - "type:chore"
      - "scope:ci"
    # NB: with `include: scope`, dependabot appends `(deps)` to the
    # prefix — so `prefix: chore(ci)` would produce the invalid
    # `chore(ci)(deps): ...` (double scope, rejected by the Conventional
    # Commits linter). Use a bare `chore` prefix and let dependabot
    # supply the single `(deps)` scope itself.
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3
