name: Commit Lint

on:
  pull_request:
    branches: [master, main]
    # Ensure the workflow re-runs on title edits (Conventional Commits
    # violations are usually fixed by editing the PR title, not by
    # pushing new commits).
    types: [opened, edited, synchronize, reopened]

# `amannn/action-semantic-pull-request@v5` needs read access to PR
# metadata; the runner default with `default_workflow_permissions=read`
# on a private repo only grants `contents: read`, so the action gets
# `Resource not accessible by integration`. Declare the exact set.
permissions:
  pull-requests: read
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce conventional commit titles
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            sec
            test
            style
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject must start with a lowercase letter and be a short
            imperative sentence — e.g. `feat(hub): add miniflux rss module`.
