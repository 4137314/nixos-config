# ==============================================================================
# HYPRLAND NATIVE DOTFILE (~/.config/hypr/hyprland.conf)
# ==============================================================================
#
# Base config: monitors, exec-once, input, dwindle, misc, bindings.
#
# Visuals (borders, decoration, blur, animations, window rules) are injected
# from Nix at rebuild time via `home/hyprland.nix` — those parts are
# parametric and live in `myTheme.*` (see modules/home/theme.nix).
# ==============================================================================

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1, 2560x1440@60, 0x0, 1
monitor=,preferred,auto,1

# hyprexpo plugin path is provided by Nix ($HYPREXPO_PATH).
exec-once = hyprctl plugin load $HYPREXPO_PATH

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# waybar starts via its systemd user unit — do NOT launch it here.
exec-once = hypridle
exec-once = swww-daemon &
exec-once = hb-wallpaper-seed
exec-once = env GDK_BACKEND=wayland swayosd-server &

env = XCURSOR_SIZE,24

input {
    kb_layout = us,it
    kb_options = grp:alt_shift_toggle
    repeat_rate = 35
    repeat_delay = 250
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}

dwindle {
    preserve_split = yes
    smart_split = no
    smart_resizing = yes
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, Return, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod CTRL, V, exec, hb-clip-menu
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, P, pseudo,
bind = $mainMod, T, togglesplit,
bind = $mainMod CTRL, J, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Space, exec, hb-switch-layout
bind = $mainMod, Escape, workspace, previous

bind = $mainMod, Tab, hyprexpo:expo, toggle
bind = $mainMod, mouse:274, hyprexpo:expo, toggle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, O, exec, hb-ops-deck
bind = $mainMod SHIFT, O, togglespecialworkspace, ops
bind = $mainMod, N, exec, hb-net-deck
bind = $mainMod SHIFT, N, togglespecialworkspace, net
bind = $mainMod, X, exec, hb-sec-deck
bind = $mainMod SHIFT, X, togglespecialworkspace, sec
bind = $mainMod, Z, exec, hb-scratch-deck
bind = $mainMod SHIFT, Z, movetoworkspace, special:scratch
bind = $mainMod, I, exec, hb-infra-deck
bind = $mainMod SHIFT, I, togglespecialworkspace, infra
bind = $mainMod, A, exec, hb-audit-deck
bind = $mainMod SHIFT, A, togglespecialworkspace, audit
bind = $mainMod, U, exec, hb-lab-deck
bind = $mainMod SHIFT, U, togglespecialworkspace, lab

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

bindl = , Pause, exec, loginctl lock-session && systemctl suspend
bindl = $mainMod CTRL SHIFT, L, exec, loginctl lock-session && systemctl suspend
bind = $mainMod CTRL, L, exec, hyprlock

# Live UI controls
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, B, exec, pkill -SIGUSR2 waybar
bind = $mainMod SHIFT, B, exec, pkill -SIGUSR1 waybar
bind = $mainMod CTRL, B, exec, waybar-widget-visibility toggle-all
bind = $mainMod ALT, B, exec, waybar-widget-visibility show
bind = $mainMod, W, exec, swww-rotate
bind = $mainMod, Y, exec, hb-command-center
bind = $mainMod SHIFT, Y, exec, hb-mode-cycle
bind = $mainMod CTRL, Y, exec, hb-agent-deck

# Move window with keyboard
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Direct resize for compact keyboards
binde = $mainMod ALT, H, resizeactive, -32 0
binde = $mainMod ALT, L, resizeactive, 32 0
binde = $mainMod ALT, K, resizeactive, 0 -32
binde = $mainMod ALT, J, resizeactive, 0 32

# Resize submap: SUPER+CTRL+R enters, arrows resize, ESC exits
bind = $mainMod CTRL, R, submap, resize
submap = resize
binde = , right, resizeactive, 32 0
binde = , left,  resizeactive, -32 0
binde = , up,    resizeactive, 0 -32
binde = , down,  resizeactive, 0 32
binde = , L, resizeactive, 32 0
binde = , H, resizeactive, -32 0
binde = , K, resizeactive, 0 -32
binde = , J, resizeactive, 0 32
bind  = , escape, submap, reset
submap = reset

# Screenshot: hardware Print plus compact-keyboard alternatives
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, slurp | grim -g - - | wl-copy
bind = $mainMod, G, exec, grim - | wl-copy
bind = $mainMod SHIFT, G, exec, slurp | grim -g - - | wl-copy
